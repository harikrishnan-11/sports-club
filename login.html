<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Stackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="scroll-progress" id="scrollProgress" style="display:none;"></div>

<header class="auth-header">
  <a href="index.html" class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 20C10 20 14 8 24 8C29 8 31 12 31 12L20 24C20 24 15 30 8 27C4.5 25.5 3 20 3 20Z" fill="#8FE84C"/>
      <path d="M3 20C3 20 9 24 15 21" stroke="#1B3B36" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span>Stackly</span>
  </a>
  <a href="index.html" class="auth-back"><i class="fa-solid fa-arrow-left"></i> Back to site</a>
</header>

<main class="auth-wrap">
  <div class="auth-media">
    <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1400&auto=format&fit=crop" alt="Kids playing soccer">
    <div class="auth-media-copy">
      <span class="tag">Welcome back</span>
      <h2>Youth Sports.<br>Done Right.</h2>
      <p>Log in to book classes, track your athlete's schedule, and manage your membership.</p>
    </div>
  </div>

  <div class="auth-panel reveal" data-reveal>
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-sub">Glad to see you again. Enter your details below.</p>

      <form id="loginForm" novalidate>
        <label class="field">
          <span>Email address</span>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
          <small class="field-error"></small>
        </label>

        <label class="field">
          <span>Password</span>
          <div class="password-wrap">
            <input type="password" name="password" placeholder="Your password" required minlength="6" autocomplete="current-password" id="loginPassword">
            <button type="button" class="toggle-pw" data-target="loginPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <small class="field-error"></small>
        </label>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="link-arrow-plain">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-dark btn-full">Log in</button>
        <p class="form-note" id="loginNote" aria-live="polite"></p>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <div class="auth-social">
        <button type="button" class="btn btn-outline btn-full"><i class="fa-brands fa-google"></i> Google</button>
        <button type="button" class="btn btn-outline btn-full"><i class="fa-brands fa-apple"></i> Apple</button>
      </div>

      <p class="auth-switch">New to Stackly? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
